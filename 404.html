<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — NSZ Toolkit</title>
  <style>
    :root { --bg: #f6f7fb; --text: #141726; --mute: #7a8098; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0c16; --text: #eef0ff; --mute: #8087ab; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    h1 { font-size: clamp(4rem, 14vw, 7rem); margin: 0; letter-spacing: -0.05em;
      background: linear-gradient(120deg, #5b5bf6, #9b4dff 55%, #ff5fa2); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--mute); }
    a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 12px; color: #fff; font-weight: 700; text-decoration: none;
      background: linear-gradient(120deg, #5b5bf6, #9b4dff 55%, #ff5fa2); }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist — maybe the tool moved?</p>
    <a id="home" href="/">Back to all tools</a>
  </div>
  <script>
    // On a GitHub Pages project site the home page lives under /<repo>/.
    if (location.hostname.endsWith("github.io")) {
      var seg = location.pathname.split("/")[1];
      if (seg) document.getElementById("home").href = "/" + seg + "/";
    }
  </script>
</body>
</html>
