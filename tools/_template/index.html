<!doctype html>
<!--
  TEMPLATE FOR A NEW TOOL
  1. Copy this folder to tools/<your-tool-id>/  (e.g. tools/image-compressor/)
  2. Change the title, description, breadcrumb, heading and icon below.
  3. Put your tool's UI inside <section class="container workspace">.
  4. Write the logic in app.js (and styles in tool.css if needed).
  5. Register the tool in assets/js/tools-registry.js so it shows on the home page.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My New Tool — NSZ Toolkit</title>
  <meta name="description" content="One sentence describing what this tool does.">
  <meta name="theme-color" content="#5b5bf6">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("nsz-theme"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="tool.css">
</head>
<body data-root="../../">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="../../index.html">Home</a>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          <a href="../../index.html#tools">Tools</a>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          <span>My New Tool</span>
        </nav>
        <div class="tool-title">
          <span class="tool-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          </span>
          <h1>My <span class="gradient-text">New Tool</span></h1>
        </div>
        <p class="lead">Explain in one or two sentences what this tool does for students.</p>
      </div>
    </section>

    <section class="container workspace">
      <div class="panel card">
        <p>Your tool's interface goes here.</p>
        <button id="demo-btn" class="btn btn-primary" type="button">Try me</button>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="../../assets/js/site.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
